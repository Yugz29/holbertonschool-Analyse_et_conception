openapi: 3.0.3
info:
  title: StockMaster-Pro API
  version: 1.0.0
  description: API de déclaration des mouvements de stock de l'entrepôt MegaShop-B2B.
  contact:
    name: Équipe API MegaShop-B2B
    email: api@megashop-b2b.com
servers:
  - url: https://api.megashop-b2b.com/v1
tags:
  - name: Inventaire
    description: Mouvements de stock déclarés par les manutentionnaires.
paths:
  /inventory/movements:
    post:
      operationId: createMouvementStock
      summary: Déclarer un mouvement de stock
      description: >
        Enregistre une entrée ou une sortie de stock sur un emplacement.
        Une sortie supérieure au stock actuel de l'emplacement est rejetée :
        le stock ne peut jamais devenir négatif.
      tags:
        - Inventaire
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MouvementStockRequest'
      responses:
        '201':
          description: Mouvement enregistré.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MouvementStock'
        '400':
          description: Requête invalide (champ manquant, type inconnu, quantité nulle ou négative).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Emplacement inconnu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Stock insuffisant pour la sortie demandée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockInsuffisantError'
components:
  schemas:
    TypeMouvement:
      type: string
      description: Colonne SQL `mouvement_stock.type_mouvement`.
      enum: [ENTREE, SORTIE]

    MouvementStockRequest:
      type: object
      additionalProperties: false
      properties:
        emplacementId:
          type: integer
          format: int32
          minimum: 1
          description: Colonne SQL `mouvement_stock.id_emplacement`.
        typeMouvement:
          $ref: '#/components/schemas/TypeMouvement'
        quantite:
          type: integer
          format: int32
          minimum: 1
          description: Colonne SQL `mouvement_stock.quantite`. Toujours positive, le sens est donné par `typeMouvement`.
      required:
        - emplacementId
        - typeMouvement
        - quantite

    MouvementStock:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          description: Colonne SQL `mouvement_stock.id`.
        emplacementId:
          type: integer
          format: int32
          description: Colonne SQL `mouvement_stock.id_emplacement`.
        typeMouvement:
          $ref: '#/components/schemas/TypeMouvement'
        quantite:
          type: integer
          format: int32
          description: Colonne SQL `mouvement_stock.quantite`.
        dateMouvement:
          type: string
          format: date-time
          description: Colonne SQL `mouvement_stock.date_mouvement`.
        stockActuel:
          type: integer
          description: Stock de l'emplacement après ce mouvement (vue SQL `stock_emplacement.stock_actuel`).
      required:
        - id
        - emplacementId
        - typeMouvement
        - quantite
        - dateMouvement
        - stockActuel

    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        message:
          type: string
          description: Message d'erreur.
      required:
        - message

    StockInsuffisantError:
      type: object
      additionalProperties: false
      properties:
        message:
          type: string
          description: Message d'erreur lisible par le manutentionnaire.
          example: Stock insuffisant pour l'emplacement 12 (stock actuel 5, sortie demandée 8).
        emplacementId:
          type: integer
          format: int32
        stockActuel:
          type: integer
          description: Stock de l'emplacement au moment du refus.
        quantiteDemandee:
          type: integer
          format: int32
          description: Quantité de la sortie refusée.
      required:
        - message
        - emplacementId
        - stockActuel
        - quantiteDemandee
